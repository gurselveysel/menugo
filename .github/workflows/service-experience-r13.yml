name: Live service experience acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/service-experience-r13.yml']
permissions:
  contents: read
jobs:
  live-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read-only live menu tools, print menu and private endpoint boundaries
        run: node tests/experience-live.integration.mjs
      - name: Live transparent logos and white merchant footer
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-service-experience
          path: |
            public/qa/experience-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
