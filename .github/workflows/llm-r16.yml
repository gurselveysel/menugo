name: Live LLM assistant acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/llm-r16.yml']
permissions:
  contents: read
jobs:
  live-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Live protected configuration, custom Edge auth and unchanged customer menu
        run: node tests/llm-live.integration.mjs
      - name: Live transparent brand assets and white footer
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-llm-acceptance
          path: |
            public/qa/llm-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
