name: Direct LLM assistant acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/llm-r16.yml']
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Import scoped source with concurrency guard
        env:
          SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-50e8-8246-9358-e71d2b52b800/raw?se=2026-09-19T00%3A35%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=dad93213-94dc-5e4c-9c36-23518ae92537&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T19%3A03%3A58Z&ske=2026-09-19T19%3A03%3A58Z&sks=b&skv=2026-02-06&sig=I9%2BHfZmYReJzFnDKPUKaeZ%2BARLR9z4vFrhMG1sigxgc%3D'
        run: |
          node --input-type=module <<'NODE'
          import{readFileSync,writeFileSync,mkdirSync,existsSync}from'node:fs';import{dirname}from'node:path';import{createHash}from'node:crypto';import{gunzipSync}from'node:zlib';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const r=await fetch(process.env.SOURCE_URL,{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Source unavailable '+r.status);
          const bytes=Buffer.from(await r.arrayBuffer());if(sha(bytes)!=='ac53fe63ab03913e4c3a620b72ae766ff9eb238545a3700c8d1e2c29844c4a0d')throw Error('Transfer checksum mismatch');
          const patch=JSON.parse(gunzipSync(bytes));if(patch.version!=='menugo-llm-assistant-20260919-r16')throw Error('Wrong release');
          const allowed=new Set(['tsconfig.json','public/release.json','app/layout.tsx','app/llm.css','docs/llm-assistant.md','tests/ai-menu.test.mjs','tests/llm-ui.integration.mjs','tests/sql.integration.mjs','tests/llm.test.mjs','lib/config.ts','components/AiMenuStudio.tsx','components/Console.tsx','components/LlmAssistant.tsx','lib/ai-menu/contracts.ts','lib/ai-menu/worker.ts','lib/llm/client.ts','lib/llm/messages.ts','lib/llm/browser.ts','app/api/llm/[action]/route.ts','app/api/ai-menu/[action]/route.ts','supabase/migrations/20260919001800_ops_llm.sql','supabase/functions/menugo-llm/index.ts','supabase/functions/menugo-llm/menu-contracts.ts','supabase/functions/menugo-llm/deno.json','supabase/functions/menugo-llm/core.ts']);
          if(Object.keys(patch.files).length!==allowed.size)throw Error('Unexpected source scope');
          for(const[p,e]of Object.entries(patch.files)){if(!allowed.has(p))throw Error('Invalid path');if(e.beforeSha256){if(!existsSync(p)||sha(readFileSync(p))!==e.beforeSha256)throw Error('Concurrent edit '+p);}else if(existsSync(p))throw Error('New file conflict '+p);}
          for(const[p,e]of Object.entries(patch.files)){mkdirSync(dirname(p),{recursive:true});writeFileSync(p,Buffer.from(e.data,'base64'));}
          console.log('Scoped LLM source verified; no real keys, customer data or prices imported.');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Edge strict type check
        id: edge
        continue-on-error: true
        run: deno check --config supabase/functions/menugo-llm/deno.json supabase/functions/menugo-llm/index.ts
      - run: npm test
      - name: SQL acceptance
        id: sql
        continue-on-error: true
        run: npm run test:sql
      - name: Native PostgreSQL locks and privileges
        id: native
        continue-on-error: true
        run: node tests/native-postgres.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Owner settings and read-only assistant UI
        id: llm
        continue-on-error: true
        run: node tests/llm-ui.integration.mjs
      - name: Existing menu review regressions
        id: menu
        continue-on-error: true
        run: node tests/ai-menu-ui.integration.mjs
      - name: Guest cashier and branding regressions
        id: regression
        continue-on-error: true
        run: node tests/codeless-e2e.integration.mjs && node tests/pilot-ui.integration.mjs && node tests/branding-ui.integration.mjs
      - name: Require all suites
        run: test '${{ steps.edge.outcome }}' = 'success' && test '${{ steps.sql.outcome }}' = 'success' && test '${{ steps.native.outcome }}' = 'success' && test '${{ steps.llm.outcome }}' = 'success' && test '${{ steps.menu.outcome }}' = 'success' && test '${{ steps.regression.outcome }}' = 'success'
      - name: Commit only accepted source without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tsconfig.json public/release.json app/layout.tsx app/llm.css docs/llm-assistant.md tests/ai-menu.test.mjs tests/llm-ui.integration.mjs tests/sql.integration.mjs tests/llm.test.mjs lib/config.ts components/AiMenuStudio.tsx components/Console.tsx components/LlmAssistant.tsx lib/ai-menu/contracts.ts lib/ai-menu/worker.ts lib/llm 'app/api/llm/[action]/route.ts' 'app/api/ai-menu/[action]/route.ts' supabase/migrations/20260919001800_ops_llm.sql supabase/functions/menugo-llm
          git commit -m 'feat: owner-managed OpenAI Gemini connection and grounded read-only LLM assistant'
          git push origin HEAD:main
          git archive --format=zip -o /tmp/menugo-r16-accepted-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-llm-acceptance
          path: |
            public/qa/llm
            public/qa/ai-menu
            test-results
            /tmp/menugo-r16-accepted-source.zip
          retention-days: 3
          if-no-files-found: ignore
