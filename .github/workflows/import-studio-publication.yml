name: Import reviewed Studio source
on:
  push:
    branches: [feat/studio-publication-r20]
    paths: [.github/workflows/import-studio-publication.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-publication-r20
      - name: Fetch exact reviewed source bundle
        env:
          SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-bf80-8246-8f7d-62aceb19f47f/raw?se=2026-09-19T14%3A45%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=b05f5c50-5c8e-5c4e-b3fc-aeaf1b7ef843&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T04%3A32%3A41Z&ske=2026-09-20T04%3A32%3A41Z&sks=b&skv=2026-02-06&sig=ABS3ODR/AbrnRVZJoxORULHUBe1Qn91vMow8drctW1g%3D'
        run: |
          curl --fail --silent --show-error --max-time 40 "$SOURCE_URL" -o /tmp/studio-source.json
          echo '2bd89fd43c801c0ec873772afb9a997d05454a52cd92e836ac64d6b07e089fce  /tmp/studio-source.json' | sha256sum -c
      - name: Check all original hashes before writing any file
        run: |
          python - <<'PY'
          import json, pathlib, hashlib, subprocess
          root = pathlib.Path.cwd()
          data = json.loads(pathlib.Path('/tmp/studio-source.json').read_text())
          assert data['base'] == 'd3f06538bbdfd7b719974eafc0b454e066bd40a2'
          files = [f for f in data['files'] if not f['path'].startswith('.github/')]
          allowed = {'app/api/catalogue/route.ts','app/api/studio/publication/route.ts','app/globals.css','components/MerchantMenu.tsx','components/RoleWorkspace.tsx','components/StudioPublishing.tsx','docs/studio-publication-r20.md','lib/config.ts','src/studio/publication.ts','supabase/migrations/20260919002000_ops_studio_text_publication.sql','tests/native-postgres.integration.mjs','tests/sql.integration.mjs','tests/studio-publication-checks.mjs','tests/studio-publication-concurrency.mjs','tests/studio-publication-ui.integration.mjs','tests/studio-publication.test.mjs'}
          assert {f['path'] for f in files} == allowed
          for f in files:
              p = root / f['path']
              assert root in p.resolve().parents
              digest = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert digest == f['previousSha256'], 'Concurrent edit: ' + f['path']
          for f in files:
              p = root / f['path']
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(f['content'])
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: reviewed text publication with atomic apply undo and source guards'
          git push origin HEAD:feat/studio-publication-r20
