name: Guest-first release acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/guest-r9.yml']
permissions:
  contents: write
jobs:
  guest-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed mixed-cart scope correction
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('supabase/migrations/20260918001200_ops_guest_dining.sql')
          assert sha256(p.read_bytes()).hexdigest()=='b569d01653534a974145f328705caedb6d74cc10adc0caa3bf16cfb3a593e6a6'
          s=p.read_text(); start=s.index('CREATE OR REPLACE FUNCTION ops.order_submit('); pre=s[:start]; t=s[start:]
          t=t.replace('AND cl.check_id=p_check_id\n    ORDER BY p.id', 'AND cl.check_id=p_check_id AND cl.created_by_user_id=auth.uid() AND cl.guest_session_id IS NULL\n    ORDER BY p.id')
          assert 'AND check_id=p_check_id\n    ORDER BY id FOR UPDATE' in t
          t=t.replace('AND check_id=p_check_id\n    ORDER BY id FOR UPDATE','AND check_id=p_check_id AND created_by_user_id=auth.uid() AND guest_session_id IS NULL\n    ORDER BY id FOR UPDATE')
          p.write_text(pre+t)
          assert sha256(p.read_bytes()).hexdigest()=='3f472915dfccb687060980c2aebf51ec407102ce7f5c34d6ec4c2fcaeede216b'
          p=Path('tests/sql.integration.mjs'); assert sha256(p.read_bytes()).hexdigest()=='fb9c728053bb5e7209e882d1a90508b24074645d25d5786705338a72d18825f0'
          s=p.read_text();mark=" await db.exec('reset role');\n fs.mkdirSync('test-results'"
          assert mark in s
          s=s.replace(mark,"""
           const ownStaffSnapshot=async()=>(await q('select ops.get_cart_snapshot($1,$2,$3) as j',[b,br,c9]))[0].j;
           const guestDraftsBefore=(await ownStaffSnapshot()).lines.length;
           await q('select ops.cart_mutate_choice($1,$2,$3,$4,$5,1,$6::bigint,null)',[b,br,c9,op(243),p2,(await ownStaffSnapshot()).revision]);
           const ownStaffOrder=(await q('select ops.order_submit($1,$2,$3,$4,$5::bigint) as j',[b,br,c9,op(244),(await ownStaffSnapshot()).revision]))[0].j;
           check('staff with own line submits only own one charge',ownStaffOrder.chargeCount===1&&ownStaffOrder.lines.length===1);
           check('staff mixed-cart submit preserves every guest draft',(await ownStaffSnapshot()).lines.length===guestDraftsBefore);
           await db.exec('reset role');
           fs.mkdirSync('test-results'""")
          p.write_text(s)
          assert sha256(p.read_bytes()).hexdigest()=='16e22c0832f34583c3ba510b8794456feaba4953d40b5f5faf0bb3a7109b966d'
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sql
      - run: node tests/native-postgres.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:ui
      - run: node tests/pilot-ui.integration.mjs
      - run: node tests/merchant-ui.integration.mjs
      - run: node tests/branding-ui.integration.mjs
      - run: node tests/guest-e2e.integration.mjs
      - name: Commit verified correction without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260918001200_ops_guest_dining.sql tests/sql.integration.mjs
          git commit -m 'fix: authenticated mixed-cart submission cannot consume guest drafts'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-guest-r9-final-acceptance
          path: |
            public/qa
            test-results
          retention-days: 3
          if-no-files-found: ignore
