name: Guest-first release acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/guest-r9.yml']
permissions:
  contents: write
jobs:
  guest-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Import reviewed source, reject concurrent edits
        env:
          SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-41fc-8246-be55-bd319ccd870b/raw?se=2026-09-17T22%3A43%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=bf345348-d0ab-5ce5-a45b-5333d06283ec&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T08%3A43%3A59Z&ske=2026-09-18T08%3A43%3A59Z&sks=b&skv=2026-02-06&sig=zEKstCDP/875Ztwa/Xdf3gmAcE8qIYy3stnm%2BrzbwPU%3D'
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync,mkdirSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const r=await fetch(process.env.SOURCE_URL,{signal:AbortSignal.timeout(30000)});
          if(!r.ok)throw Error('Source transfer failed '+r.status);
          const bytes=Buffer.from(await r.arrayBuffer());
          if(sha(bytes)!=='9cfa182b97fa374c402427be6ee93367e02cfd2a3daa137d5333922fb5f01412')throw Error('Source checksum mismatch');
          const bundle=JSON.parse(gunzipSync(bytes));
          if(bundle.release!=='menugo-guest-first-20260918-r9'||Object.keys(bundle.files).length!==30)throw Error('Unexpected source release');
          for(const [path,entry] of Object.entries(bundle.files)){
            if(path.startsWith('/')||path.split('/').some(x=>['..','.github','.git','node_modules','.next'].includes(x))||path.startsWith('.env'))throw Error('Invalid source path');
            if(entry.beforeSha256){if(!existsSync(path)||sha(readFileSync(path))!==entry.beforeSha256)throw Error('Concurrent edit '+path);}
            else if(existsSync(path))throw Error('Unexpected existing path '+path);
          }
          for(const [path,entry] of Object.entries(bundle.files)){mkdirSync(dirname(path),{recursive:true});writeFileSync(path,Buffer.from(entry.data,'base64'));}
          writeFileSync('/tmp/menugo-source-paths',Object.keys(bundle.files).join('\0')+'\0');
          console.log('Verified 30 scoped source files, no credentials or customer records.');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sql
      - name: Native PostgreSQL 17 and competing guest transactions
        run: node tests/native-postgres.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:ui
      - run: node tests/pilot-ui.integration.mjs
      - run: node tests/merchant-ui.integration.mjs
      - run: node tests/branding-ui.integration.mjs
      - name: Four guest browsers through Next API and SQL
        run: node tests/guest-e2e.integration.mjs
      - name: Commit only tested source, without force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -0 git add -- < /tmp/menugo-source-paths
          git commit -m 'feat: secure guest-first table ordering, personal drafts and service controls'
          git push origin HEAD:main
          git archive --format=zip -o /tmp/menugo-r9-reviewed.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-guest-r9-acceptance
          path: |
            public/qa
            test-results
            /tmp/menugo-r9-reviewed.zip
          retention-days: 3
          if-no-files-found: ignore
