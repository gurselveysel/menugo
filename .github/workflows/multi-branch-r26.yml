name: Multi branch r26
on:
  push:
    branches: ['feat/multibranch-master-menu-r26']
  pull_request:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: multi-branch-r26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'gurselveysel/menugo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: PGlite SQL and RLS acceptance
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          (npm run test:sql && node tests/multi-branch-menu.sql.integration.mjs) 2>&1 | tee test-results/multi-branch-sql.log
      - name: Native PostgreSQL 17 and concurrency
        shell: bash
        run: |
          set -o pipefail
          (node tests/native-postgres.integration.mjs && node tests/multi-branch-menu-concurrency.mjs) 2>&1 | tee test-results/multi-branch-native.log
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: UI regression and multi-branch browser acceptance
        run: npm run test:ui && node tests/multi-branch-menu-ui.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-branch-r26-qa
          path: |
            test-results
            public/qa/multi-branch
          if-no-files-found: ignore
