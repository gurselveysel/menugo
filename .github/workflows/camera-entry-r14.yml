name: Camera source verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require committed scanner source
        run: |
          test -f components/TableScanner.tsx || { echo 'Camera implementation is not yet committed. No deployment will be performed.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node tests/scanner-ui.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-verification
          path: public/qa/scanner
          if-no-files-found: ignore
          retention-days: 3
