name: Live AI menu studio acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-menu-r15.yml']
permissions:
  contents: read
jobs:
  live-ai-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Private AI boundaries and unchanged real customer catalogue
        run: node tests/ai-menu-live.integration.mjs
      - name: Live transparent brand assets and white footer
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-ai-menu-acceptance
          path: |
            public/qa/ai-menu-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
