name: Live codeless ordering acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/codeless-r12.yml']
permissions:
  contents: read
jobs:
  live-codeless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read-only customer routes, real table policy and staff access boundaries
        run: node tests/codeless-live.integration.mjs
      - name: Real-domain transparent logo and white footer checks
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-codeless-acceptance
          path: |
            public/qa/codeless-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
