name: Open models validation
on:
  push:
    branches: ['feat/self-hosted-open-models']
permissions:
  contents: write
concurrency:
  group: open-models-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'gurselveysel/menugo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/self-hosted-open-models
      - name: Apply one-time, reviewable source migration
        run: |
          if ! grep -q OPEN_MODELS supabase/functions/menugo-llm/core.ts; then
            python3 scripts/open-source-backend-transition.py
            python3 scripts/open-source-ui-transition.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/api components lib/ai-menu lib/llm public/open-models-release.json supabase/functions/menugo-llm supabase/migrations/20260919002200_ops_open_source_llm.sql tests/llm.test.mjs tests/sql.integration.mjs
            git commit -m 'feat: self-hosted Qwen inference with no paid fallback'
            git push origin HEAD:feat/self-hosted-open-models
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge types
        run: deno check supabase/functions/menugo-llm/index.ts
      - run: npm test
      - run: npm run test:sql && node tests/studio.sql.integration.mjs
      - name: Native PostgreSQL 17
        run: node tests/native-postgres.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:ui && node tests/studio-ui.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-models-qa
          path: |
            test-results
            public/qa
          if-no-files-found: ignore
