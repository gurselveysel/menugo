name: Live editorial menu and brand acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/editorial-r17.yml']
permissions:
  contents: read
jobs:
  live-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wait for the expected production release
        run: |
          node --input-type=module <<'NODE'
          let ready=false;
          for(let i=0;i<36;i++){
            try{
              const r=await fetch('https://www.menugo.app/release.json',{cache:'no-store',signal:AbortSignal.timeout(5000)});
              if(r.ok&&(await r.json()).version==='menugo-editorial-branding-20260919-r17'){ready=true;break;}
            }catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw Error('Expected r17 is not on the production domain');
          console.log('r17 found on production. Continuing with GET-only live checks.');
          NODE
      - name: Real-domain visual cards, current prices and protected API boundaries
        run: node tests/editorial-live.integration.mjs
      - name: Canonical transparent logos and entirely white footer
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-editorial-acceptance
          path: |
            public/qa/editorial-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
