name: MenuGO checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: menugo-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sql && node tests/studio.sql.integration.mjs && node tests/studio-photo-sql.integration.mjs && node tests/studio-cost-sql.integration.mjs
      - name: Real PostgreSQL 17 constraints and row locks
        run: node tests/native-postgres.integration.mjs && node tests/studio-cost-native.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:ui && node tests/pilot-ui.integration.mjs && node tests/studio-ui.integration.mjs && node tests/customer-menu-assistant-ui.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-qa
          path: public/qa
          if-no-files-found: ignore
