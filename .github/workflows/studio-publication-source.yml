name: Studio publication source
on:
  push:
    branches: [feat/studio-publication-r20]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/menugo-studio-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: menugo-studio-source
          path: /tmp/menugo-studio-source.zip
          retention-days: 3
