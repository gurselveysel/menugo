name: Live visual ordering handover acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-handover-r18.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wait for the accepted production revision
        run: |
          node --input-type=module <<'NODE'
          const expected='menugo-visual-handover-20260919-r18';
          let matched=false;
          for(let n=0;n<36;n++){
            try{
              const r=await fetch('https://www.menugo.app/release.json',{cache:'no-store',signal:AbortSignal.timeout(8000)});
              if(r.ok&&(await r.json()).version===expected){matched=true;break;}
            }catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!matched)throw Error('Accepted production release not observed');
          console.log('Production revision verified:',expected);
          NODE
      - name: Real menu prices, working navigation and camera priority
        run: node tests/visual-handover.integration.mjs
        env:
          VISUAL_LIVE: '1'
      - name: Real logo transparency and all-white merchant footer
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-visual-handover
          path: |
            public/qa/visual-handover-live
            public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
