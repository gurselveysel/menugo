name: PDF renderer dependency lock
on:
  push:
    branches: [feat/local-pdf-menu-r30]
    paths: [.github/workflows/pdf-dependency-r30.yml]
permissions:
  contents: write
jobs:
  dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-pdf-menu-r30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned official PDF renderer without running lifecycle scripts
        run: npm install --save-exact --package-lock-only --ignore-scripts pdfjs-dist@6.3.289
      - name: Commit only dependency manifests to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'build: lock official PDF.js 6.3.289 dependency'
          git push origin HEAD:feat/local-pdf-menu-r30
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-renderer-locked-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 2
