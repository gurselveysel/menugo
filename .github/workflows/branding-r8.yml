name: Live merchant branding check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/branding-r8.yml']
permissions:
  contents: read
jobs:
  live-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm production release
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://www.menugo.app/release.json',{cache:'no-store',signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Production release unavailable');
          const release=await r.json();
          if(release.version!=='menugo-transparent-branding-20260917-r8')throw Error('Wrong production release: '+release.version);
          console.log('Production release verified:',release.version);
          NODE
      - name: Live mobile and desktop DOM, CSS and logo-alpha checks
        run: node tests/branding-ui.integration.mjs
        env:
          BRAND_TEST_BASE_URL: https://sariyerborekcisi.menugo.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menugo-live-branding-qa
          path: public/qa/branding-live
          retention-days: 3
          if-no-files-found: ignore
