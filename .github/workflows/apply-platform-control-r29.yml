name: Import and verify company control center
on:
  push:
    branches: ['feat/platform-control-center-r29']
permissions:
  contents: write
concurrency:
  group: apply-platform-r29
  cancel-in-progress: true
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: menugo_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-control-center-r29
      - name: Apply hash-checked source edits from repository
        run: |
          python scripts/releases/apply-platform-r29.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components lib src supabase tests docs public/release.json
          git diff --cached --quiet || git commit -m 'feat: verified company control center wiring'
          git push origin HEAD:feat/platform-control-center-r29
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:sql && node tests/studio.sql.integration.mjs
      - run: node tests/native-postgres.integration.mjs
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/menugo_ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: node tests/platform-control-ui.integration.mjs && node tests/platform-ai-ui.integration.mjs
      - run: node tests/llm-ui.integration.mjs && node tests/studio-ui.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-control-acceptance
          path: |
            public/qa/platform-control
            public/qa/platform-ai
            public/qa/llm
            public/qa/studio
            test-results
          retention-days: 3
